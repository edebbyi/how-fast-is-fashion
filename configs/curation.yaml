# Trend curation config.
#
# Two ways to find candidate images (both go through the same review queue
# and never touch the labeled corpus without a human approving):
#
#   1. Query search — type a free-text query ("clean luxury fashion outfit")
#      into the review app; hits Google Custom Search (image mode). See
#      GOOGLE_CSE_API_KEY / GOOGLE_CSE_ID in .env.example for setup, and the
#      `search_*` settings below for defaults.
#   2. Page scraping — either paste a single page URL into the review app
#      on demand (works for a Pinterest board/pin link, an editorial page,
#      anything), or pre-configure recurring pages under `sources:` below
#      and run scripts/scrape_trend_sites.py / the "Scrape configured
#      sources" button.
#
# `trend_hint` (search results and configured sources alike) pre-selects a
# trend in the review UI — it's a suggestion, not a label. The reviewer can
# override it or leave a candidate unsorted.

# --- Query search defaults ---
search_max_results_default: 20
search_safe_mode: "active"  # Google CSE safe-search: "active" or "off"

# --- Page scraping: pre-configured recurring sources (optional) ---
# Replace with real trend-site URLs, or leave empty and rely on the review
# app's "Search the web" / "Scrape a page" boxes instead.
sources: []

# Minimum bytes to keep a candidate image (filters out icons/tracking pixels)
min_image_bytes: 8000

# Maximum candidate images to pull per source per run (configured sources
# and ad-hoc pasted-URL scrapes alike)
max_images_per_source: 40

request_timeout_seconds: 10
retry_count: 2
delay_between_sources_seconds: 2

# Heuristic filters for page scraping (same idea as configs/mining.yaml
# good/bad signals). Not applied to query search results.
bad_url_signals:
  - "logo"
  - "icon"
  - "sprite"
  - "avatar"
  - "favicon"
  - ".svg"
  - "pixel"
  - "tracking"
  - "1x1"
  - "placeholder"
