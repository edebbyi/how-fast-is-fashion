[project]
name = "fashion-forensics"
version = "0.1.0"
description = "Fashion trend intelligence from fast-fashion retail data"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Data
    "pandas>=2.2",
    "pyarrow>=15.0",
    "polars>=0.20",
    "duckdb>=1.1",

    # Mining
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",

    # NLP / trend detection
    "scikit-learn>=1.4",
    "google-genai>=1.0",
    "openai>=1.0",

    # Vector DB (reference corpus retrieval)
    "qdrant-client>=1.9",

    # MLOps
    "mlflow>=2.10",
    "langfuse>=2.0",

    # App
    "streamlit>=1.30",

    # Logging
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]
training = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.45",
    "peft>=0.9",
    "sentence-transformers>=2.5",
    "mlflow>=2.10",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "umap-learn>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_forensics"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: E402 (module-level import not at top of cell) is a normal pattern;
# E501 (line too long) is less critical in exploratory cells.
"notebooks/*.ipynb" = ["E402", "E501"]
# Test cases with wide dict literals for readability
"tests/test_benchmark.py" = ["E501"]
# Legacy scripts with long prompt strings / URLs / inline analysis
"scripts/seed_langfuse_prompts.py" = ["E501"]
"scripts/download_data.py" = ["E501"]
"src/fashion_forensics/evaluation/benchmark.py" = ["E501"]
"src/fashion_forensics/app/components/performance.py" = ["E501", "F841"]
"src/fashion_forensics/app/components/query.py" = ["E501", "F841"]
"src/fashion_forensics/mining/miner.py" = ["E501"]
"src/fashion_forensics/normalization/normalizer.py" = ["E501"]
"src/fashion_forensics/nlp/trend_engine.py" = ["E501", "UP042"]
# Training module: import guards for optional deps (fail fast on missing torch/transformers)
"src/fashion_forensics/training/lora.py" = ["F401", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
